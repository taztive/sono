<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SONO — Studio</title><link rel="stylesheet" href="/admin/studio.css"><script type="module" src="/admin/app.js"></script></head><body>
<div id="auth" class="auth"><div class="auth-card"><img src="/sono-logo.svg" alt="SONO" width="150"><p class="eyebrow">PRIVATE STUDIO</p><h1 id="auth-title">おかえりなさい。</h1><p id="auth-copy">プランと物語を、ここから育てる。</p><form id="login"><label>管理者パスワード<input id="password" type="password" autocomplete="current-password" required maxlength="512"></label><label id="confirm-wrap" hidden>パスワードを確認<input id="confirm-password" type="password" autocomplete="new-password"></label><button class="primary" type="submit">Studioを開く →</button></form><p id="auth-error" role="alert"></p><p class="muted small">初回設定は起動時の専用リンクから。<br>この画面に顧客情報や下書きは含まれません。</p></div></div>
<div id="app" hidden><aside class="sidebar"><a href="/admin" class="brand"><img src="/sono-logo.svg" alt="SONO" width="136"><span>STUDIO / 編集室</span></a><nav aria-label="管理メニュー"><p class="nav-label">WORKSPACE</p><button data-view="overview">概況 <span>Overview</span></button><button data-view="plan">体験プラン <span>Plans</span></button><p class="nav-label">MARKETING</p><button data-view="magazine">Magazine <span>企画・誌面</span></button><button data-view="video">Video <span>絵コンテ・Vコン</span></button><button data-view="calendar">投稿予約 <span>Calendar</span></button><button data-view="analytics">数値・流入分析 <em>SOON</em></button><p class="nav-label">OPERATIONS</p><button data-view="archive">アーカイブ</button><button data-view="settings">接続・バックアップ</button></nav><footer><span class="dot"></span> <span id="mode">Private workspace</span><button id="logout">ログアウト ↗</button></footer></aside>
<main><header class="topbar"><span id="breadcrumb">SONO / STUDIO</span><a href="/plans" target="_blank" rel="noopener">公開プランを見る ↗</a></header><section id="content"></section></main></div>
<dialog id="editor"><form id="edit-form"><header class="editor-top"><div><span class="eyebrow" id="editor-kind"></span><h2 id="editor-title">プランを編集</h2></div><button type="button" id="close-editor" class="icon" aria-label="閉じる">×</button></header><div class="editor-body" id="fields"></div><footer class="editor-bottom"><span id="save-note" class="muted">変更は保存するまで反映されません</span><button type="submit" class="primary">保存する</button></footer></form></dialog>
<dialog id="preview"><header class="editor-top"><h2 id="preview-title">プレビュー</h2><button id="close-preview" class="icon" aria-label="閉じる">×</button></header><div id="preview-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
